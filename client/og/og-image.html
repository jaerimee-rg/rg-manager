<!doctype html>
<!-- Open Graph 이미지 원본 (1200×630). 다시 만들 때: npm run og  → public/og-image.png -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 앱 토큰(styles/tokens.css)과 같은 값: 평면 + 1px 보더, Pretendard, 블루 포인트 */
  :root { --bg: #F7F7F5; --surface: #FFFFFF; --border: #E9E9E9; --ink: #1B1B1B; --ink-600: #6B6B6B; --ink-500: #8A8A8A; --brand: #3182F6; --brand-50: #EFF6FF; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif;
    font-synthesis: none;
    background: var(--bg);
    position: relative; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: absolute; inset: 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 32px;
    display: grid; grid-template-columns: 360px 1fr; align-items: center; gap: 48px;
    padding: 0 72px 0 64px;
  }
  .logo-wrap { display: flex; align-items: center; justify-content: center; width: 360px; height: 360px; border-radius: 40px; background: var(--bg); border: 1px solid var(--border); }
  .logo { width: 268px; height: auto; display: block; }
  h1 {
    font-size: 108px; line-height: 1.05; font-weight: 800; letter-spacing: -3px; color: var(--ink);
  }
  h2 {
    margin-top: 22px;
    font-size: 36px; line-height: 1.3; font-weight: 500; letter-spacing: -0.6px; color: var(--ink-600);
    word-break: keep-all;
  }
  .chips { display: flex; gap: 12px; margin-top: 34px; }
  .chip {
    display: inline-flex; align-items: center; height: 52px; padding: 0 22px;
    border-radius: 999px; background: var(--brand-50); color: #1650B0;
    font-size: 24px; font-weight: 600; letter-spacing: -0.3px;
  }
  .url {
    position: absolute; right: 72px; bottom: 44px;
    font-size: 22px; font-weight: 500; color: var(--ink-500); letter-spacing: -0.2px;
  }
  .accent { position: absolute; left: 64px; bottom: 0; width: 140px; height: 6px; border-radius: 3px 3px 0 0; background: var(--brand); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap"><img class="logo" src="../public/logo-mark.png" alt=""></div>
    <div>
      <h1>JR 리듬체조</h1>
      <h2>출석 · 이벤트 · 학부모 소통을<br>한곳에서</h2>
      <div class="chips">
        <span class="chip">출석 체크</span>
        <span class="chip">이벤트 신청</span>
        <span class="chip">사진 앨범</span>
      </div>
    </div>
    <div class="url">rg-manager.vercel.app</div>
    <div class="accent"></div>
  </div>
</body>
</html>
