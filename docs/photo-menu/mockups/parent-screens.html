<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 메뉴 — 학부모 화면</title>
<!-- 앱과 같은 서체·스타일 (client/index.html, client/src/main.jsx 와 같은 순서) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&display=swap">
<link rel="stylesheet" href="../../../client/src/styles/tokens.css">
<link rel="stylesheet" href="../../../client/src/styles/ui.css">
<link rel="stylesheet" href="../../../client/src/styles/App.css">
<link rel="stylesheet" href="photo-menu.css">
</head>
<body>

<!--
  화면 하나를 ?s=<이름> 으로 골라 그린다. parent-mobile.html 에서 보는 것을 권한다.
  s: list | list-empty | album | upload | private | event
  학부모 화면은 지금(main) 화면의 DOM 을 그대로 옮겼다 — 이번에 바뀌는 것은 "공개된 앨범만 보인다" 와 문구 몇 줄뿐이다.
-->

<div class="ui-mobile-app">
  <header class="ui-mobile-app__header">
    <div class="ui-mobile-app__inner ui-mobile-app__head-row" id="head-row"></div>
  </header>
  <main class="ui-mobile-app__main">
    <div class="ui-mobile-app__inner ui-mobile-app__content" id="main"></div>
  </main>
  <nav class="ui-tabbar" aria-label="학부모 메뉴">
    <div class="ui-mobile-app__inner ui-tabbar__row" id="tabbar"></div>
  </nav>
</div>

<script src="mock-icons.js"></script>
<script src="mock-photos.js"></script>
<script>
(function () {
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
  var icon = function (name, size) { return '<i data-icon="' + name + '" data-size="' + (size || 18) + '"></i>'; };

  // 학부모에게 보이는 앨범 = 선생님이 "공개" 한 것 중 공개 범위에 드는 것
  // (teacher-screens 의 4개 중 회장배(참가 학부모) · 스페셜 클래스(모든 학부모). 비공개 2개는 나오지 않는다)
  var ALBUMS = [
    { id: 31, title: '회장배 리듬체조 대회', type: 'competition', date: '2026-10-12', location: '잠실학생체육관', photos: 41, videos: 3, mine: 12, seed: 0, uploadOpen: true },
    { id: 27, title: '스페셜 클래스 — 후프', type: 'special', date: '2026-09-27', location: 'JR 리듬체조 연습실', photos: 18, videos: 0, mine: 4, seed: 6, uploadOpen: true }
  ];

  // ── 골격 (ParentLayout) ──
  var layout = function (opt) {
    document.getElementById('head-row').innerHTML =
      (opt.back ? '<button type="button" class="ui-icon-btn" data-size="sm" data-variant="ghost" aria-label="뒤로">' + icon('arrowLeft', 18) + '</button>' : '') +
      '<div class="ui-mobile-app__titles"><h1 class="ui-mobile-app__title">' + esc(opt.title) + '</h1>' +
      (opt.subtitle ? '<div class="ui-mobile-app__subtitle">' + opt.subtitle + '</div>' : '') + '</div>';
    var tabs = [['일정', 'calendar', 'schedule'], ['사진', 'image', 'photos'], ['채팅', 'message', 'soon'], ['내 정보', 'user', 'me']];
    document.getElementById('tabbar').innerHTML = tabs.map(function (t) {
      if (t[2] === 'soon') return '<span title="곧 추가됩니다" class="ui-tabbar__item" data-soon="true">' + icon(t[1], 24) + '<span class="ui-tabbar__label">' + t[0] + '</span></span>';
      var on = t[2] === opt.tab;
      return '<a href="#" class="ui-tabbar__item"' + (on ? ' data-active="true" aria-current="page"' : '') + '>' + icon(t[1], 24) + '<span class="ui-tabbar__label">' + t[0] + '</span></a>';
    }).join('');
  };

  // ── 사진 탭 목록 (ParentAlbumList 의 카드 DOM 그대로) ──
  var albumCard = function (a) {
    var previews = [0, 1, 2, 3].map(function (k) {
      return '<img data-photo="' + (a.seed + k) + '" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; background: var(--color-gray-200);">';
    }).join('');
    return '<button type="button" style="display: block; width: 100%; text-align: left; padding: 0; margin-bottom: 12px; background: var(--surface); border-radius: var(--shape-panel); overflow: hidden; border: var(--stroke); cursor: pointer; font-family: inherit;">' +
      '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; height: 88px; background: var(--color-gray-100);">' + previews + '</div>' +
      '<div style="padding: 12px 14px;">' +
      '<div style="display: flex; align-items: center; gap: 6px; margin-bottom: 4px;">' +
      '<span class="badge ' + (a.type === 'competition' ? 'badge-danger' : 'badge-purple') + '">' + (a.type === 'competition' ? '🏆 대회' : '⭐ 스페셜') + '</span>' +
      '<span class="badge ' + (a.uploadOpen ? 'badge-primary' : 'badge-gray') + '">' + (a.uploadOpen ? '사진 올릴 수 있어요' : '업로드 마감') + '</span></div>' +
      '<div style="font-size: 0.9375rem; font-weight: 700; line-height: 1.35; word-break: keep-all;">' + esc(a.title) + '</div>' +
      '<div style="font-size: 0.75rem; color: var(--color-gray-500); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 10px;"><span>📅 ' + a.date + '</span><span>📍 ' + esc(a.location) + '</span></div>' +
      '<div style="font-size: 0.75rem; color: var(--color-gray-500); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px 10px;"><span>사진 ' + a.photos + (a.videos ? ' · 영상 ' + a.videos : '') + '</span>' +
      '<span style="color: var(--color-primary); font-weight: 700;">우리 아이 ' + a.mine + '장</span></div>' +
      '</div></button>';
  };

  var listPage = function () {
    layout({ title: '사진', subtitle: '선생님이 공개한 앨범', tab: 'photos' });
    return ALBUMS.map(albumCard).join('');
  };

  var listEmpty = function () {
    layout({ title: '사진', subtitle: '선생님이 공개한 앨범', tab: 'photos' });
    return '<div style="text-align: center; padding: 50px 20px;"><div style="font-size: 2.5rem;">📷</div>' +
      '<div style="font-size: 1rem; font-weight: 700; margin-top: 8px;">아직 공개된 앨범이 없어요</div>' +
      '<div style="font-size: 0.8125rem; color: var(--color-gray-500); line-height: 1.6; margin-top: 6px;">선생님이 대회·이벤트 앨범을 공개하면<br>여기에 바로 보여요.</div></div>';
  };

  // ── 갤러리 (ParentAlbum 의 DOM 그대로) ──
  var chip = function (label, count, active) {
    return '<button type="button" aria-pressed="' + active + '" style="display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: var(--shape-btn); white-space: nowrap; cursor: pointer; font-family: inherit; font-size: 0.78rem; font-weight: 600; min-height: 34px; border: var(--stroke-thin); background: ' +
      (active ? 'var(--ink)' : 'var(--field)') + '; color: ' + (active ? 'var(--paper)' : 'var(--ink-900)') + ';">' + label +
      ' <span style="font-size: 0.6875rem; opacity: 0.7; font-weight: 700;">' + count + '</span></button>';
  };
  var VIDEO = { 2: '0:42', 9: '1:15', 15: '0:28' };
  var grid = function (count) {
    var out = '';
    for (var i = 0; i < count; i += 1) {
      if (i === 13) continue;   // 선생님이 숨긴 사진은 학부모에게 오지 않는다
      out += '<button type="button" class="ui-media-tile"><img data-photo="' + i + '" alt="">' +
        (VIDEO[i] ? '<span class="ui-media-tile__video">' + icon('play', 10) + VIDEO[i] + '</span>' : '') + '</button>';
    }
    return out;
  };
  var fab = function (open) {
    return '<button type="button" style="position: fixed; right: 16px; bottom: calc(74px + env(safe-area-inset-bottom)); height: 50px; padding: 0 18px; border-radius: var(--shape-btn); background: ' +
      (open ? 'var(--color-primary)' : 'var(--color-gray-400)') + '; color: var(--paper); border: none; font-weight: 800; font-size: 0.9375rem; font-family: inherit; box-shadow: ' +
      (open ? 'var(--shadow-popover)' : 'none') + '; z-index: 15;">' + (open ? '＋ 올리기' : '업로드 마감') + '</button>';
  };

  var albumPage = function () {
    var a = ALBUMS[0];
    layout({ title: a.title, subtitle: a.date + ' · 사진 ' + a.photos + ' · 영상 ' + a.videos, back: true, tab: 'photos' });
    return '<button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--bg-tertiary); border: var(--stroke-thin); border-radius: var(--shape-box); padding: 10px 12px; cursor: pointer; font-family: inherit; margin-bottom: 10px;">' +
      '<span style="font-size: 1.1rem;">🙂</span><span style="flex: 1; min-width: 0;"><b style="display: block; font-size: 0.875rem; font-weight: 700;">우리 아이 사진만 보기</b>' +
      '<span style="font-size: 0.6875rem; color: var(--color-gray-500);">얼굴로 자동으로 찾아드려요</span></span>' +
      '<span aria-hidden="true" style="width: 44px; height: 26px; border-radius: var(--shape-btn); flex-shrink: 0; position: relative; border: var(--stroke-thin); background: var(--field);">' +
      '<span style="position: absolute; top: 1.5px; left: 1.5px; width: 20px; height: 20px; border-radius: var(--shape-blob); background: var(--ink);"></span></span></button>' +
      '<div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 8px;">' +
      chip('전체', 44, true) + chip('사진', 41, false) + chip('영상', 3, false) + chip('내가 올린 것', 2, false) + '</div>' +
      '<div class="ui-media-grid">' + grid(19) + '</div>' +
      '<div style="font-size: 0.75rem; color: var(--color-gray-400); text-align: center; padding: 14px 2px 0; line-height: 1.6;">사진을 누르면 크게 보고 저장할 수 있어요<br>원본 화질 그대로 Google Drive 에 보관돼요</div>' +
      fab(true);
  };

  // ── 학부모 업로드 시트 (같은 UploadSheet) ──
  var uploadSheet = function () {
    var rows = [
      { n: 20, name: 'IMG_5531.JPG', sub: '3.1MB · 얼굴 1명 찾음', state: '완료', done: true },
      { n: 21, name: 'IMG_5532.JPG', sub: '2.9MB · 1.6MB / 2.9MB', pct: 55 },
      { n: 22, name: 'IMG_5533.MOV', sub: '96MB · 기다리는 중', state: '대기' }
    ];
    return '<div class="ui-scrim"></div><div class="ui-overlay" data-mode="sheet" data-size="md" role="dialog" aria-label="사진 올리기">' +
      '<div class="ui-overlay__grip"></div><div class="ui-overlay__header"><div><h2 class="ui-overlay__title">사진 올리기</h2>' +
      '<p class="ui-overlay__description">회장배 리듬체조 대회 · 선생님 앨범에 바로 올라가요</p></div></div>' +
      '<div class="ui-overlay__body">' + rows.map(function (r) {
        return '<div class="ui-upload-row"><img data-photo="' + r.n + '" alt=""><div style="min-width: 0;"><div class="ui-upload-row__name">' + r.name + '</div>' +
          '<div class="ui-upload-row__sub">' + r.sub + '</div>' + (r.pct ? '<div class="ui-progress"><div class="ui-progress__bar" style="width:' + r.pct + '%;"></div></div>' : '') +
          '</div><span class="ui-upload-row__state">' + (r.done ? '<span class="ui-row" data-gap="1">' + icon('checkCircle', 16) + '완료</span>' : r.pct ? r.pct + '%' : r.state) + '</span></div>';
      }).join('') +
      '<p class="ui-hand ui-mt-3" style="margin-bottom: 0;">올린 사진은 같은 앨범의 다른 학부모도 볼 수 있어요. 내가 올린 것만 지울 수 있어요.</p></div>' +
      '<div class="ui-overlay__footer"><button type="button" class="ui-btn" data-variant="outline" data-size="md">' + icon('plus', 18) + '더 고르기</button>' +
      '<button type="button" class="ui-btn" data-variant="primary" data-size="md" disabled>완료</button></div></div>';
  };

  // ── 비공개 앨범 주소로 직접 들어왔을 때 (403 album_private) ──
  var privatePage = function () {
    layout({ title: '사진', back: true, tab: 'photos' });
    return '<div class="ui-empty" style="padding-top: var(--space-9);"><span class="ui-empty__icon">' + icon('lock', 28) + '</span>' +
      '<p class="ui-empty__title">선생님이 아직 공개하지 않은 앨범이에요</p>' +
      '<p class="ui-empty__description">공개되면 ‘사진’ 탭에 나타나요. 조금만 기다려 주세요.</p>' +
      '<div class="ui-empty__actions"><button type="button" class="ui-btn" data-variant="outline" data-size="md">사진 목록으로</button></div></div>';
  };

  // ── 이벤트 상세의 사진 미리보기 (ParentEventDetail '사진 · 영상' 섹션 DOM 그대로) ──
  var eventPage = function () {
    var a = ALBUMS[0];
    layout({ title: a.title, back: true, tab: 'schedule' });
    var previews = [0, 1, 3, 4].map(function (k) { return '<img data-photo="' + k + '" alt="">'; }).join('');
    return '<div class="ui-stack" data-gap="5">' +
      '<div class="ui-stack" data-gap="2"><div class="ui-row" data-gap="2"><span class="badge badge-danger">🏆 대회</span><span class="ui-text-sm ui-text-subtle">끝난 일정</span></div>' +
      '<div class="ui-stack" data-gap="1"><div class="ui-row ui-text-sm" data-gap="2">' + icon('calendar', 16) + '2026-10-12 (월) 09:00</div>' +
      '<div class="ui-row ui-text-sm" data-gap="2">' + icon('mapPin', 16) + a.location + '</div></div></div>' +
      '<section class="ui-section"><div class="ui-section__head"><div><h2 class="ui-section__title">사진 · 영상</h2></div></div>' +
      '<button type="button" class="ui-card" data-padding="none" data-interactive="true"><div class="ui-album-preview">' + previews + '</div>' +
      '<div class="ui-row" data-gap="3" data-justify="between" style="padding: var(--space-3) var(--space-4);"><div>' +
      '<div class="ui-list-row__title">앨범 열기</div><div class="ui-list-row__subtitle">사진 ' + a.photos + ' · 영상 ' + a.videos + ' · 우리 아이 ' + a.mine + '장</div></div>' +
      icon('chevronRight', 18) + '</div></button>' +
      '<p class="mock-hint" style="margin: 0;">(목업 설명) 선생님이 공개한 앨범일 때만 이 칸이 보여요. 올리기는 앨범 안에서만 해요.</p></section>' +
      '<section class="ui-section"><div class="ui-section__head"><div><h2 class="ui-section__title">신청한 학생 7명</h2><p class="ui-section__description">이름 가나다순</p></div></div>' +
      '<div class="ui-text-sm ui-text-subtle">김하은 · 박서윤 · 이지우 · 정예린 · 최다인 · 한소율 · 황유나</div></section></div>';
  };

  var SCREENS = {
    list: listPage,
    'list-empty': listEmpty,
    album: albumPage,
    upload: function () { var html = albumPage(); return { html: html, overlay: uploadSheet() }; },
    'private': privatePage,
    event: eventPage
  };
  var name = new URLSearchParams(location.search).get('s') || 'list';
  var out = (SCREENS[name] || SCREENS.list)();
  if (typeof out === 'string') out = { html: out };
  document.getElementById('main').innerHTML = out.html;
  if (out.overlay) document.body.insertAdjacentHTML('beforeend', out.overlay);

  window.renderMockIcons();
  window.renderMockPhotos();

  document.addEventListener('click', function (e) {
    if (e.target.closest('a, button')) e.preventDefault();
  });

  var post = function () {
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'mock-height', h: Math.ceil(document.documentElement.scrollHeight) }, '*');
    }
  };
  window.addEventListener('load', post);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(post);
  if (window.ResizeObserver) new ResizeObserver(post).observe(document.body);
})();
</script>
</body>
</html>
